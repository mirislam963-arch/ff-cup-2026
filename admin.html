
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FF CUP 2026 — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;padding:20px;background:#071426;color:white;font-family:Arial}
main{max-width:900px;margin:auto}
.card{background:#10233d;padding:20px;border-radius:15px;margin:15px 0}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:8px}
input{background:#071426;color:white;border:1px solid #345}
button{background:#39d7f2;color:#071426;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#29435e;color:white}
#message{white-space:pre-wrap;padding:12px;background:#18334d;border-radius:8px}
.player{padding:14px 0;border-bottom:1px solid #345}
.actions{display:flex;gap:8px}
.actions button{flex:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>🏆 FF CUP 2026</h1>
<p>Панель администратора</p>

<section class="card" id="loginPanel">
<h2>Вход администратора</h2>
<input id="email" type="email" placeholder="Email администратора">
<input id="password" type="password" placeholder="Пароль">
<button id="loginButton">ВОЙТИ</button>
</section>

<section class="card" id="adminPanel" hidden>
<h2>Заявки игроков</h2>
<button class="secondary" id="refreshButton">Обновить заявки</button>
<button class="secondary" id="logoutButton">Выйти</button>
<div id="players"></div>
</section>

<p id="message">Готов к работе.</p>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const $ = id => document.getElementById(id);
  const message = text => $("message").textContent = text;

  const SUPABASE_URL =
    "https://rciwumuqhwpncviyojnj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_t6mgrMh69tBD7dy021EnIA_SbWwJg6n";

  if (!window.supabase) {
    message("Не загрузилась библиотека Supabase. Проверь интернет и обнови страницу.");
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  $("loginButton").addEventListener("click", async () => {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !password) {
      message("Введи email и пароль.");
      return;
    }

    $("loginButton").disabled = true;
    message("Проверяем вход...");

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      if (!data.session) {
        throw new Error("Сессия не создана. Попробуй войти ещё раз.");
      }

      $("loginPanel").hidden = true;
      $("adminPanel").hidden = false;

      message("Вход выполнен. Загружаем заявки...");
      await loadPlayers();

    } catch (error) {
      message("Ошибка входа: " + error.message);
    } finally {
      $("loginButton").disabled = false;
    }
  });

  async function loadPlayers() {
    message("Загружаем заявки...");

    const { data, error } = await db
      .from("players")
      .select("id,nickname,game_uid,status,created_at")
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) {
      message(
        "Не удалось загрузить заявки: " + error.message +
        "\nПроверь права SELECT в RLS."
      );
      return;
    }

    const container = $("players");
    container.innerHTML = "";

    if (!data || data.length === 0) {
      message("Заявок пока нет.");
      return;
    }

    data.forEach(player => {
      const item = document.createElement("div");
      item.className = "player";

      const info = document.createElement("p");
      info.textContent =
        "Ник: " + player.nickname +
        " | UID: " + player.game_uid +
        " | Статус: " + player.status +
        " | Заявка: " +
        (player.created_at
          ? new Date(player.created_at).toLocaleString("ru-RU")
          : "—");

      item.appendChild(info);

      const actions = document.createElement("div");
      actions.className = "actions";

      [
        { status: "approved", label: "Одобрить" },
        { status: "rejected", label: "Отклонить" }
      ].forEach(action => {
        const button = document.createElement("button");
        button.textContent = action.label;

        button.addEventListener("click", async () => {
          button.disabled = true;
          message("Обновляем статус...");

          try {
            const { error } = await db
              .from("players")
              .update({ status: action.status })
              .eq("id", player.id);

            if (error) throw error;

            message("Статус заявки обновлён.");
            await loadPlayers();

          } catch (error) {
            message(
              "Не удалось изменить статус: " + error.message +
              "\nВозможно, нет права UPDATE в RLS."
            );
          } finally {
            button.disabled = false;
          }
        });

        actions.appendChild(button);
      });

      item.appendChild(actions);
      container.appendChild(item);
    });

    message("Заявок загружено: " + data.length);
  }

  $("refreshButton").addEventListener("click", loadPlayers);

  $("logoutButton").addEventListener("click", async () => {
    const { error } = await db.auth.signOut();

    if (error) {
      message("Ошибка выхода: " + error.message);
      return;
    }

    $("adminPanel").hidden = true;
    $("loginPanel").hidden = false;
    message("Ты вышел из панели администратора.");
  });
});
</script>
</body>
</html>
